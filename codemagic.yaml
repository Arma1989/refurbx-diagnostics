workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Genera il progetto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara la firma
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print
          xcode-project use-profiles --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --archive-method app-store --code-signing-setup-verbose-logging || true
          echo  | base64 -D > /tmp/apply_profile.py
          python3 /tmp/apply_profile.py
      - name: Compila l'app
        script: |
          set -euo pipefail
          UUID="$(tr -d '[:space:]' < /tmp/refurbx-profile-uuid.txt)"
          if ! xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX --export-options-plist "$HOME/export_options.plist" --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO DEVELOPMENT_TEAM=L9F47LJC86 PROVISIONING_PROFILE=${UUID} PROVISIONING_PROFILE_SPECIFIER=${UUID}"; then
            echo "===== ERRORE DI COMPILAZIONE ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' 2>/dev/null | while read -r log; do
              echo "----- $log -----"
              grep -E "error:|fatal error:|CodeSign|Provisioning|entitlement" "$log" | tail -n 40 || true
            done
            exit 65
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
