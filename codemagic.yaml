workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Genera il progetto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara la firma
        script: |
          set -euo pipefail
          keychain initialize
          echo  | base64 -D > /tmp/apply_profile.py
          app-store-connect bundle-ids list --json --log-stream stderr > /tmp/asc-bundles.json
          BID=$(python3 /tmp/apply_profile.py --bundle-resource-id /tmp/asc-bundles.json)
          echo "App ID eu.refurbx.diagnostics risorsa $BID"
          app-store-connect bundle-ids capabilities "$BID" --log-stream stderr | tee /tmp/refurbx-capabilities.txt
          if ! grep -q "NFC Tag Reading" /tmp/refurbx-capabilities.txt; then
            app-store-connect bundle-ids enable-capabilities "$BID" --capability "NFC Tag Reading" --log-stream stderr
            app-store-connect bundle-ids capabilities "$BID" --log-stream stderr | tee /tmp/refurbx-capabilities.txt
          fi
          if ! grep -q "NFC Tag Reading" /tmp/refurbx-capabilities.txt; then
            echo "NFC Tag Reading non risulta attivo sull'App ID $BID. Senza quel permesso Apple non mette TAG nel profilo e l'iPhone dirà che manca il permesso."
            exit 1
          fi
          app-store-connect bundle-ids profiles --json --log-stream stderr --bundle-ids "$BID" --type IOS_APP_STORE > /tmp/asc-profiles.json
          python3 /tmp/apply_profile.py --drop-untagged /tmp/asc-profiles.json > /tmp/refurbx-drop-profiles.txt
          while IFS= read -r profile_id; do
            if [[ -z "$profile_id" ]]; then
              continue
            fi
            echo "Elimino il profilo App Store senza NFC TAG: $profile_id"
            app-store-connect profiles delete "$profile_id" --ignore-not-found --log-stream stderr
          done < /tmp/refurbx-drop-profiles.txt
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -delete
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print
          python3 /tmp/apply_profile.py
          xcode-project use-profiles --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --archive-method app-store --profile "$(head -n 1 /tmp/refurbx-profile-path.txt)" --code-signing-setup-verbose-logging || true
          python3 /tmp/apply_profile.py
      - name: Compila l'app
        script: |
          set -euo pipefail
          if [[ ! -f /tmp/apply_profile.py ]]; then
            echo  | base64 -D > /tmp/apply_profile.py
          fi
          python3 /tmp/apply_profile.py
          echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
          echo "UUID profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-uuid.txt)"
          echo "Il profilo contiene NFC TAG: $(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)"
          if [[ "$(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)" != "sì" ]]; then
            echo "Il profilo App Store su Codemagic non include il permesso NFC TAG, quindi l'iPhone continuerà a dire che manca il permesso."
            echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
            exit 1
          fi
          echo "Export options:"
          plutil -p "$HOME/export_options.plist" || true
          if ! xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX --export-options-plist "$HOME/export_options.plist" --archive-xcargs "$(head -n 1 /tmp/refurbx-archive-xcargs.txt)"; then
            echo "===== ERRORE DI COMPILAZIONE ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' 2>/dev/null | while read -r log; do
              echo "----- $log -----"
              grep -E "error:|fatal error:|CodeSign|Provisioning|entitlement" "$log" | tail -n 40 || true
            done
            exit 65
          fi
          python3 /tmp/apply_profile.py --repair-signed
          ipa_count=0
          while IFS= read -r ipa; do
            ipa_count=$((ipa_count + 1))
            check_dir="$(mktemp -d)"
            unzip -q "$ipa" -d "$check_dir"
            ipa_app=""
            while IFS= read -r candidate; do
              ipa_app="$candidate"
              break
            done < <(find "$check_dir/Payload" -maxdepth 1 -name '*.app' -type d)
            if [[ -z "$ipa_app" ]]; then
              echo "L'IPA non contiene un'app. Pubblicazione interrotta."
              exit 1
            fi
            ent_file="$(mktemp)"
            codesign -d --entitlements :- "$ipa_app" >"$ent_file" 2>&1 || true
            echo "Firma di $ipa_app dentro $ipa"
            echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
            echo "Controllo codesign -d --entitlements :- sull'app dentro l'IPA, non sull'archivio."
            cat -v "$ent_file"
            if grep -a -q 'NDEF' "$ent_file"; then
              echo "La firma contiene NDEF. App Store Connect la rifiuta con l'errore 90778. Il permesso deve restare solo TAG. Pubblicazione interrotta."
              exit 1
            fi
            if ! grep -a -q 'com.apple.developer.nfc.readersession.formats' "$ent_file" || ! grep -a -q 'TAG' "$ent_file"; then
              echo "La build è firmata senza il permesso NFC TAG. L'iPhone mostrerebbe «Missing required entitlement». Pubblicazione interrotta."
              echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
              exit 1
            fi
            python3 /tmp/apply_profile.py --check-ipa "$ipa"
          done < <(find build/ios/ipa -name '*.ipa' -type f | sort)
          if [[ "$ipa_count" -eq 0 ]]; then
            echo "IPA non trovato. Pubblicazione interrotta."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: MANUAL
        copyright: "2026 REFURBX S.R.L."

  ios-ipad-screenshots:
    name: RefurbX screenshot iPad
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Genera progetto
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Compila e acquisisci tre schermate iPad
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('RefurbX/DiagView.swift')
          source = p.read_text()
          marker = '        .preferredColorScheme(.light)'
          assert marker in source, 'Punto di inserimento screenshot non trovato'
          if '--store-screen' not in source:
              source = source.replace(marker, base64.b64decode('').decode() + marker, 1)
              p.write_text(source)
          PY
          mkdir -p screenshots
          xcrun simctl list devices available -j > /tmp/refurbx-simulators.json
          DEVICE_ID=$(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/refurbx-simulators.json'))
          candidates = []
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  name = device['name']
                  if 'iPad Pro' in name and ('13-inch' in name or '12.9-inch' in name):
                      candidates.append(device)
          if not candidates:
              raise SystemExit('Nessun simulatore iPad Pro 13 o 12.9 disponibile.')
          candidates.sort(key=lambda d: ('13-inch' in d['name'], d['name']))
          print(candidates[-1]['udid'])
          PY
          )
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcodebuild -project RefurbX.xcodeproj -scheme RefurbX -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE_ID" -derivedDataPath build/screenshots CODE_SIGNING_ALLOWED=NO build > screenshots/build.log 2>&1
          xcrun simctl install "$DEVICE_ID" build/screenshots/Build/Products/Debug-iphonesimulator/RefurbX.app
          for screen in home touch report; do
            xcrun simctl terminate "$DEVICE_ID" eu.refurbx.diagnostics || true
            xcrun simctl launch "$DEVICE_ID" eu.refurbx.diagnostics --store-screen "$screen"
            sleep 5
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/iPad-$screen.png"
          done
          for image in screenshots/*.png; do
            sips -g pixelWidth -g pixelHeight "$image"
          done
    artifacts:
      - screenshots/*.png
      - screenshots/build.log