workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Genera il progetto Xcode
        script: |
          rm -f RefurbX/RingerNotify.m RefurbX/RingerNotify.h RefurbX/RefurbX-Bridging-Header.h
          if grep -R -n --include='*.m' --include='*.h' --include='*.swift' --include='*.plist' "ringerstate\|springboard" . ; then
            echo "Trovata l'API privata del tasto silenzioso. Pubblicazione interrotta."
            exit 1
          fi
          set -euo pipefail
          python3 scripts/validate_release.py
          python3 scripts/test_signing.py
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Prepara la firma
        script: |
          set -euo pipefail
          keychain initialize
          cp "$CM_BUILD_DIR/scripts/apply_profile.py" /tmp/apply_profile.py
          app-store-connect bundle-ids list --json --log-stream stderr > /tmp/asc-bundles.json
          BID=$(python3 /tmp/apply_profile.py --bundle-resource-id /tmp/asc-bundles.json)
          echo "App ID eu.refurbx.diagnostics risorsa $BID"
          app-store-connect bundle-ids capabilities "$BID" --log-stream stderr | tee /tmp/refurbx-capabilities.txt
          if ! grep -q "NFC Tag Reading" /tmp/refurbx-capabilities.txt; then
            app-store-connect bundle-ids enable-capabilities "$BID" --capability "NFC Tag Reading" --log-stream stderr
            app-store-connect bundle-ids capabilities "$BID" --log-stream stderr | tee /tmp/refurbx-capabilities.txt
          fi
          if ! grep -q "NFC Tag Reading" /tmp/refurbx-capabilities.txt; then
            echo "NFC Tag Reading non risulta attivo sull'App ID $BID. Senza quel permesso Apple non mette TAG nel profilo e l'iPhone dirà che manca il permesso."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -delete
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print
          python3 /tmp/apply_profile.py
          xcode-project use-profiles --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --archive-method app-store --profile "$(head -n 1 /tmp/refurbx-profile-path.txt)" --code-signing-setup-verbose-logging || true
          python3 /tmp/apply_profile.py
      - name: Compila l'app
        script: |
          set -euo pipefail
          if [[ ! -f /tmp/apply_profile.py ]]; then
            cp "$CM_BUILD_DIR/scripts/apply_profile.py" /tmp/apply_profile.py
          fi
          python3 /tmp/apply_profile.py
          echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
          echo "UUID profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-uuid.txt)"
          echo "Il profilo contiene NFC TAG: $(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)"
          if [[ "$(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)" != "sì" ]]; then
            echo "Il profilo App Store su Codemagic non include il permesso NFC TAG, quindi l'iPhone continuerà a dire che manca il permesso."
            echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
            exit 1
          fi
          echo "Export options:"
          plutil -p "$HOME/export_options.plist" || true
          if ! xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX --export-options-plist "$HOME/export_options.plist" --archive-xcargs "$(head -n 1 /tmp/refurbx-archive-xcargs.txt)"; then
            echo "===== ERRORE DI COMPILAZIONE ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' 2>/dev/null | while read -r log; do
              echo "----- $log -----"
              grep -E "error:|fatal error:|CodeSign|Provisioning|entitlement" "$log" | tail -n 40 || true
            done
            exit 65
          fi
          python3 /tmp/apply_profile.py --repair-signed
          ipa_count=0
          while IFS= read -r ipa; do
            ipa_count=$((ipa_count + 1))
            check_dir="$(mktemp -d)"
            unzip -q "$ipa" -d "$check_dir"
            ipa_app=""
            while IFS= read -r candidate; do
              ipa_app="$candidate"
              break
            done < <(find "$check_dir/Payload" -maxdepth 1 -name '*.app' -type d)
            if [[ -z "$ipa_app" ]]; then
              echo "L'IPA non contiene un'app. Pubblicazione interrotta."
              exit 1
            fi
            ent_file="$(mktemp)"
            codesign -d --entitlements :- "$ipa_app" >"$ent_file" 2>&1 || true
            echo "Firma di $ipa_app dentro $ipa"
            echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
            echo "Controllo codesign -d --entitlements :- sull'app dentro l'IPA, non sull'archivio."
            cat -v "$ent_file"
            if grep -a -q 'NDEF' "$ent_file"; then
              echo "La firma contiene NDEF. App Store Connect la rifiuta con l'errore 90778. Il permesso deve restare solo TAG. Pubblicazione interrotta."
              exit 1
            fi
            if ! grep -a -q 'com.apple.developer.nfc.readersession.formats' "$ent_file" || ! grep -a -q 'TAG' "$ent_file"; then
              echo "La build è firmata senza il permesso NFC TAG. L'iPhone mostrerebbe «Missing required entitlement». Pubblicazione interrotta."
              echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
              exit 1
            fi
            python3 /tmp/apply_profile.py --check-ipa "$ipa"
          done < <(find build/ios/ipa -name '*.ipa' -type f | sort)
          if [[ "$ipa_count" -eq 0 ]]; then
            echo "IPA non trovato. Pubblicazione interrotta."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        # Solo caricamento su App Store Connect. La revisione parte da lì, a mano.
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  ios-compile-check:
    name: RefurbX - verifica compilazione senza firma
    max_build_duration: 45
    instance_type: mac_mini_m2
    triggering:
      events: []
    environment:
      xcode: latest
    scripts:
      - name: Controlli preliminari e test firma offline
        script: |
          set -euo pipefail
          python3 scripts/validate_release.py
          python3 scripts/test_signing.py
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen generate
      - name: Compila per simulatore iOS senza certificati
        script: |
          set -euo pipefail
          mkdir -p build
          if ! xcodebuild -project RefurbX.xcodeproj -scheme RefurbX -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/compile-check CODE_SIGNING_ALLOWED=NO build > build/compile-check.log 2>&1; then
            tail -n 100 build/compile-check.log
            exit 1
          fi
          tail -n 20 build/compile-check.log
    artifacts:
      - build/compile-check.log
