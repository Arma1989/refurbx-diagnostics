workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: eu.refurbx.diagnostics
    scripts:
      - name: Genera il progetto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara la firma
        script: |
          keychain initialize
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compila l'app
        script: |
          xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
