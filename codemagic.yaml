workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Genera il progetto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara la firma
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print
          echo  | base64 -D > /tmp/apply_profile.py
          python3 /tmp/apply_profile.py
          xcode-project use-profiles --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --archive-method app-store --profile "$(head -n 1 /tmp/refurbx-profile-path.txt)" --code-signing-setup-verbose-logging || true
          python3 /tmp/apply_profile.py
      - name: Compila l'app
        script: |
          set -euo pipefail
          if [[ ! -f /tmp/apply_profile.py ]]; then
            echo  | base64 -D > /tmp/apply_profile.py
          fi
          python3 /tmp/apply_profile.py
          echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
          echo "UUID profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-uuid.txt)"
          echo "Il profilo contiene NFC TAG: $(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)"
          if [[ "$(tr -d '\n' < /tmp/refurbx-profile-has-tag.txt)" != "sì" ]]; then
            echo "Il profilo App Store su Codemagic non include il permesso NFC TAG, quindi l'iPhone continuerà a dire che manca il permesso."
            echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
            exit 1
          fi
          echo "Export options:"
          plutil -p "$HOME/export_options.plist" || true
          if ! xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX --export-options-plist "$HOME/export_options.plist" --archive-xcargs "$(head -n 1 /tmp/refurbx-archive-xcargs.txt)"; then
            echo "===== ERRORE DI COMPILAZIONE ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' 2>/dev/null | while read -r log; do
              echo "----- $log -----"
              grep -E "error:|fatal error:|CodeSign|Provisioning|entitlement" "$log" | tail -n 40 || true
            done
            exit 65
          fi
          python3 /tmp/apply_profile.py --repair-signed
          ipa_count=0
          while IFS= read -r ipa; do
            ipa_count=$((ipa_count + 1))
            check_dir="$(mktemp -d)"
            unzip -q "$ipa" -d "$check_dir"
            ipa_app=""
            while IFS= read -r candidate; do
              ipa_app="$candidate"
              break
            done < <(find "$check_dir/Payload" -maxdepth 1 -name '*.app' -type d)
            if [[ -z "$ipa_app" ]]; then
              echo "L'IPA non contiene un'app. Pubblicazione interrotta."
              exit 1
            fi
            ent_file="$(mktemp)"
            codesign -d --entitlements :- "$ipa_app" >"$ent_file" 2>&1 || true
            echo "Firma di $ipa_app dentro $ipa"
            echo "Profilo scelto: $(tr -d '\n' < /tmp/refurbx-profile-name.txt)"
            echo "Controllo codesign -d --entitlements :- sull'app dentro l'IPA, non sull'archivio."
            cat -v "$ent_file"
            if grep -a -q 'NDEF' "$ent_file"; then
              echo "La firma contiene NDEF. App Store Connect la rifiuta con l'errore 90778. Il permesso deve restare solo TAG. Pubblicazione interrotta."
              exit 1
            fi
            if ! grep -a -q 'com.apple.developer.nfc.readersession.formats' "$ent_file" || ! grep -a -q 'TAG' "$ent_file"; then
              echo "La build è firmata senza il permesso NFC TAG. L'iPhone mostrerebbe «Missing required entitlement». Pubblicazione interrotta."
              echo "The App Store profile on Codemagic does not include the NFC TAG entitlement, so the phone will keep saying the permission is missing."
              exit 1
            fi
            python3 /tmp/apply_profile.py --check-ipa "$ipa"
          done < <(find build/ios/ipa -name '*.ipa' -type f | sort)
          if [[ "$ipa_count" -eq 0 ]]; then
            echo "IPA non trovato. Pubblicazione interrotta."
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
