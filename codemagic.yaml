workflows:
  ios-testflight:
    name: RefurbX iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RefurbX
    triggering:
      events: []
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Genera il progetto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara la firma
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files eu.refurbx.diagnostics --type IOS_APP_STORE --create --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          find "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" -name '*.mobileprovision' -print
          echo  | base64 -D > /tmp/apply_profile.py
          python3 /tmp/apply_profile.py
          xcode-project use-profiles --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --archive-method app-store --profile "$(head -n 1 /tmp/refurbx-profile-path.txt)" --code-signing-setup-verbose-logging || true
          python3 /tmp/apply_profile.py
      - name: Compila l'app
        script: |
          set -euo pipefail
          if ! xcode-project build-ipa --project "$CM_BUILD_DIR/RefurbX.xcodeproj" --scheme RefurbX --export-options-plist "$HOME/export_options.plist" --archive-xcargs "$(head -n 1 /tmp/refurbx-archive-xcargs.txt)"; then
            echo "===== ERRORE DI COMPILAZIONE ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' 2>/dev/null | while read -r log; do
              echo "----- $log -----"
              grep -E "error:|fatal error:|CodeSign|Provisioning|entitlement" "$log" | tail -n 40 || true
            done
            exit 65
          fi
          python3 /tmp/apply_profile.py --repair-signed
          require_nfc_tag() {
            local target="$1"
            local dump
            dump="$(codesign -d --entitlements :- "$target" 2>/dev/null || true)"
            if ! printf '%s\n' "$dump" | grep -q '<string>TAG</string>'; then
              dump="$(codesign -d --entitlements - --xml "$target" 2>/dev/null || true)"
            fi
            echo "Firma di $target"
            printf '%s\n' "$dump"
            if printf '%s\n' "$dump" | grep -q '<string>NDEF</string>'; then
              echo "La firma contiene NDEF. App Store Connect la rifiuta con l'errore 90778. Il permesso deve restare solo TAG. Pubblicazione interrotta."
              exit 1
            fi
            if ! printf '%s\n' "$dump" | grep -q 'com.apple.developer.nfc.readersession.formats' || ! printf '%s\n' "$dump" | grep -q '<string>TAG</string>'; then
              echo "La build è firmata senza il permesso NFC TAG. L'iPhone mostrerebbe «Missing required entitlement». Pubblicazione interrotta."
              exit 1
            fi
          }
          while IFS= read -r app; do
            require_nfc_tag "$app"
          done < <(find build/ios/xcarchive -path '*/Products/Applications/*.app' -type d 2>/dev/null || true)
          ipa=""
          while IFS= read -r candidate; do
            ipa="$candidate"
            break
          done < <(find build/ios/ipa -name '*.ipa' -type f 2>/dev/null || true)
          if [[ -z "$ipa" ]]; then
            echo "IPA non trovato. Pubblicazione interrotta."
            exit 1
          fi
          check_dir="$(mktemp -d)"
          unzip -q "$ipa" -d "$check_dir"
          ipa_app=""
          while IFS= read -r candidate; do
            ipa_app="$candidate"
            break
          done < <(find "$check_dir/Payload" -name '*.app' -maxdepth 1 -type d)
          if [[ -z "$ipa_app" ]]; then
            echo "L'IPA non contiene un'app. Pubblicazione interrotta."
            exit 1
          fi
          require_nfc_tag "$ipa_app"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
