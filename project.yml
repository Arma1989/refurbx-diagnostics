name: RefurbX
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: L9F47LJC86
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  RefurbX:
    type: application
    platform: iOS
    sources:
      - path: RefurbX
        excludes:
          - Info.plist
          - RefurbX.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.refurbx.diagnostics
        MARKETING_VERSION: "1.0.51"
        CURRENT_PROJECT_VERSION: "52"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: RefurbX/Info.plist
        CODE_SIGN_ENTITLEMENTS: RefurbX/RefurbX.entitlements
        DEVELOPMENT_TEAM: L9F47LJC86
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: RefurbX/RefurbX.entitlements
          OTHER_CODE_SIGN_FLAGS: "--generate-entitlement-der"
