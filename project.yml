name: RefurbX
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  fileTypes:
    mp4:
      buildPhase: resources
settings:
  base:
    DEVELOPMENT_TEAM: L9F47LJC86
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
targets:
  RefurbX:
    type: application
    platform: iOS
    sources:
      - path: RefurbX
        excludes:
          - Info.plist
          - RefurbX.entitlements
          - RefurbX-Bridging-Header.h
          - "Grades/*.mp4"
      - path: RefurbX/Grades/grade-aplus.mp4
        buildPhase: resources
      - path: RefurbX/Grades/grade-a.mp4
        buildPhase: resources
      - path: RefurbX/Grades/grade-b.mp4
        buildPhase: resources
      - path: RefurbX/Grades/grade-c.mp4
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.refurbx.diagnostics
        MARKETING_VERSION: "1.0.60"
        CURRENT_PROJECT_VERSION: "61"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: RefurbX/Info.plist
        CODE_SIGN_ENTITLEMENTS: RefurbX/RefurbX.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: RefurbX/RefurbX-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/RefurbX"
        DEVELOPMENT_TEAM: L9F47LJC86
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: RefurbX/RefurbX.entitlements
          OTHER_CODE_SIGN_FLAGS: "--generate-entitlement-der"
